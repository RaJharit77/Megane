name: Deploy Next.js site to Pages

on:
  push:
    branches: ["megane"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx next lint || npx eslint . --ext .ts,.tsx,.js,.jsx

      - name: Build Next.js app
        run: npm run build
